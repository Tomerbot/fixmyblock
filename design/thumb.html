<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Devpost thumbnail, 1200x800. The phone shows the live app (run the local server first). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; }
  body {
    position: relative;
    background: #34383C;
    color: #F1F2EF;
    font-family: "Overpass", sans-serif;
  }
  .ring {
    position: absolute;
    left: 590px;
    top: 30px;
    width: 700px;
    height: 700px;
  }
  .copy { position: absolute; left: 76px; top: 92px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .brand svg { width: 44px; height: 44px; }
  h1 {
    margin: 58px 0 0;
    font-size: 100px;
    line-height: 0.98;
    font-weight: 800;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  p {
    margin: 40px 0 0;
    font-size: 29px;
    line-height: 1.35;
    font-weight: 500;
    color: #C9CCC8;
    white-space: nowrap;
  }
  .phone {
    position: absolute;
    left: 800px;
    top: 58px;
    width: 332px;
    height: 704px;
    padding: 12px;
    border-radius: 44px;
    background: #1E2023;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
  }
  .screen {
    width: 308px;
    height: 680px;
    border-radius: 32px;
    overflow: hidden;
    position: relative;
    background: #F1F2EF;
  }
  .screen iframe {
    width: 390px;
    height: 861px;
    border: 0;
    transform: scale(0.7897);
    transform-origin: 0 0;
  }
  .lane {
    position: absolute;
    left: 76px;
    bottom: 64px;
    display: flex;
    gap: 28px;
  }
  .lane span { width: 64px; height: 10px; background: #FFC72C; }
</style>
</head>
<body>
  <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
    <filter id="spray" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#FF5A1F" stroke-width="9" filter="url(#spray)"/>
  </svg>

  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#FF5A1F" stroke-width="5"/></svg>
      FixMyBlock
    </div>
    <h1>See it.<br>Pin it.<br>Get it fixed.</h1>
    <p>Report street problems with a photo.<br>Neighbors confirm them, and the city<br>sees what to fix first.</p>
  </div>

  <div class="phone"><div class="screen"><iframe src="http://localhost:8093/" title="FixMyBlock app"></iframe></div></div>

  <div class="lane" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
</body>
</html>
